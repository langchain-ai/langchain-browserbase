[project]
name = "langchain-stagehand"
version = "0.1.0"
description = "Browserbase and Stagehand browser middleware for LangChain agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "langchain>=1.4.7,<2",
  "stagehand>=4.3.0,<5",
  "stagehand-middleware>=0.1.1,<0.2",
]

[project.urls]
Repository = "https://github.com/langchain-ai/langchain-browserbase"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<0.16"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests/typecheck.py"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
